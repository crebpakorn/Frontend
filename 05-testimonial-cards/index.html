<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <title>Testimonial Cards</title>
  </head>
  <body>
    <main class="testmonials">
      <h1>What our customers say</h1>

      <section class="testimonial-grid">
        <article class="card card-dark">
          <div class="person">
            <img src="https://i.pravatar.cc/80?img=12" alt="Alex Johnson" />
            <div>
              <h2>Alex Johnson</h2>
              <p>Product Designer</p>
            </div>
          </div>

          <blockquote>
            "This product completely changed the way our team works."
          </blockquote>
        </article>

        <article class="card">
          <div class="person">
            <img src="https://i.pravatar.cc/80?img=32" alt="Sarah Smith" />
            <div>
              <h2>Sarah Smith</h2>
              <p>Frontend Developer</p>
            </div>
          </div>

          <p>The interface is simple, fast and very easy to use.</p>
        </article>
        <!-- เพิ่ม card อีกหลายใบ -->
      </section>
    </main>
  </body>
</html>
